name: "Package: publish @youdotcom-oss/ai-sdk-plugin"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Prerelease number (optional, creates x.y.z-next.N)"
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$INPUT_BUMP" != "patch" && "$INPUT_BUMP" != "minor" && "$INPUT_BUMP" != "major" ]]; then
            echo "::error::Invalid bump type: $INPUT_BUMP"
            exit 1
          fi

          if [[ -n "$INPUT_PRERELEASE" ]] && ! echo "$INPUT_PRERELEASE" | grep -qE '^[0-9]+$'; then
            echo "::error::Invalid prerelease value: $INPUT_PRERELEASE"
            exit 1
          fi

          echo "✓ Input validation passed"

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node for npm OIDC publish
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Compute version
        id: set_version
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          CURRENT=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT"

          BASE=$(echo "$CURRENT" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          case "$INPUT_BUMP" in
            major) base_version="$((MAJOR + 1)).0.0" ;;
            minor) base_version="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) base_version="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          if [[ "$BRANCH_NAME" != "main" ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          if [[ -n "$INPUT_PRERELEASE" ]]; then
            IS_PRERELEASE="true"
            VERSION="${base_version}-next.${INPUT_PRERELEASE}"
          elif [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_NUM=$(jq -r '.version' package.json | grep -oE 'next\.[0-9]+$' | grep -oE '[0-9]+$' || echo "0")
            PRERELEASE_NUM=$((PRERELEASE_NUM + 1))
            VERSION="${base_version}-next.${PRERELEASE_NUM}"
          else
            VERSION="$base_version"
          fi

          echo "Publishing version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Update package.json version
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json

      - name: Build
        run: bun run build

      - name: Publish to npm
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          npm publish --provenance --access public

      - name: Commit version bump
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: publish v${VERSION} [skip ci]"
          git push

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          IS_PRERELEASE: ${{ steps.set_version.outputs.is_prerelease }}
        run: |
          TAG="ai-sdk-plugin@v${VERSION}"
          TITLE="ai-sdk-plugin v${VERSION}"

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "${TAG}" --title "${TITLE}" --generate-notes --prerelease
          else
            gh release create "${TAG}" --title "${TITLE}" --generate-notes
          fi
